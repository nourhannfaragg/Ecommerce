<section class=" p-4 ">
    <div class="container  grid sm:grid-cols-12 gap-10 items-start">
        <div class=" bg-red-100 col-span-8 rounded-lg shadow-red-400 p-4">

          <div class=" flex items-center space-x-4">
            <h1 class="text-3xl">Cart</h1>
            <span class="text-orange-700"> {{cartDetails.products.length}} Items</span>
          </div>
        
          @for (item of cartDetails.products; track item.product._id) {
            <div class="bg-red-100 p-2 shadow-red-400 my-2 border-b grid sm:grid-cols-12">
            <div class="col-span-1"> 
                <img [src]="item.product.imageCover" class="w-full" [alt]="item.product.title">
            </div>

            <div class="col-span-11 flex items-center justify-between mx-5 ">
             <div>
               <h3> {{item.product.title}} </h3>
               <div class="flex items-center space-x-6 my-3 ">
                <div class="bg-red-100 border rounded-lg flex items-center space-x-10 py-1 px-2">
                <button (click)="updateCount( item.product._id , item.count -1)" class="cursor-pointer">
                    <i class="fas fa-minus"></i>
                </button>
                   <span> {{item.count}} </span>
                <button (click)="updateCount(item.product._id , item.count +1 )" class="cursor-pointer">
                    <i class="fas fa-plus"></i>
                </button>
               </div>
                <button (click)="removeItem(item.product._id)" class="cursor-pointer">
                    <i class=" fas fa-trash-can"></i>
                </button>
               </div>
             </div>

             <span>{{item.price * item.count}} EGP </span>
            </div>
        </div>
          }

        </div>

        <div class="col-span-4 bg-red-100 p-4 rounded-lg shadow-red-400">
            <h1 class="text-3xl"> Order Summary</h1>
            <div class=" flex items-center justify-between my-4">
               <h3>  Price</h3>
               <h4>{{cartDetails.totalCartPrice}}</h4>
            </div>
            <button [routerLink]="['/checkout' , cartDetails._id]" class=" bg-red-400 border rounded-lg border-red-900 cursor-pointer text-white
             py-2 mt-2 w-full hover:bg-red-700 transition-all duration:300 disabled:bg-gray-600 
             disabled:cursor-not-allowed ">Proceed To CheckOut</button>
        </div>
    </div>

</section>
