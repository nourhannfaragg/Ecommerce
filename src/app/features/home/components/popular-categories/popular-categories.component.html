
<section class="py-5 bg-red-100 ">
    <div class="container mx-auto">
        <h2 class=" mb-4 p-3 text-2xl text-red-600 "> Shop Popular Categories :</h2>


         <owl-carousel-o [options]="categoriesOptions">

           @for (category of categoriesList; track category._id) 
           {
             <ng-template carouselSlide [id]="category._id">
                <div>
                    <img [src]="category.image" class="w-full h-[250px] border border-red-700 rounded-lg" [alt]="category.name" >
                    <h3 class="mt-3"> {{category.name}} </h3>
                </div>
                </ng-template>
            }

          </owl-carousel-o>

    </div>
    

</section>
