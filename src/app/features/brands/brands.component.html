 <section class="bg-red-100 py-10">
    <div class="container mx-auto">
        <input [(ngModel)]="text" placeholder="Search By Name......" type="search" class="block border border-red-600 rounded-lg w-72  mx-auto my-10" >
        <h2 class="text-red-600 text-2xl p-5"> All Brands :</h2>
        <div class=" parent grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            @for (brand of brandsList | search:text; track brand._id ) {
                <div class="card overflow-hidden border border-red-300 shadow-lg shadow-red-800 p-1 relative rounded-lg group/card">
                <img [src]="brand.image" class="w-full h-[200px] rounded-t "  [alt]="brand.name">
                <h3 class=" text-xl text-red-600 pt-2 line-clamp-1"> Name:{{brand.name}} </h3>
            </div>
            }
        </div>
    </div>
 </section>
